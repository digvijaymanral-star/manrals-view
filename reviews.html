<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Guest memories from Manral’s View in Machhor, Uttarakhand.">
<title>Guest Memories | Manral’s View</title>
<style>
:root{--forest:#203b30;--cream:#f7f4ec;--sage:#e3e9df}
*{box-sizing:border-box}
html{background:var(--cream);min-height:100%}
body{margin:0;background:var(--cream);color:var(--forest);font-family:Arial,Helvetica,sans-serif}
header{padding:22px 5%;display:flex;justify-content:center;background:#fffdf8;border-bottom:1px solid #203b3012}
.brand{font:700 1.45rem Georgia,serif;color:var(--forest);text-decoration:none}
.intro{text-align:center;padding:34px 16px 30px;background:linear-gradient(135deg,var(--sage),var(--cream))}
.intro p{font:italic clamp(1.2rem,3vw,1.9rem)/1.35 Georgia,serif;margin:0 auto;max-width:720px}
main{max-width:1320px;margin:0 auto;padding:28px 22px 54px}
.guest-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.guest-card{position:relative;min-width:0;height:clamp(280px,32vw,430px);overflow:hidden;border-radius:18px;background:#dfe5dc;box-shadow:0 10px 28px #20352d18}
.guest-card img{display:block;width:100%;height:100%;object-fit:cover}
.guest-name{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 18px;color:white;font-weight:700;font-size:1.05rem;letter-spacing:.02em;background:linear-gradient(transparent,#101b16e8);text-shadow:0 1px 4px #0008}
.back{text-align:center;margin:32px 0 0}
.back a{display:inline-block;padding:12px 20px;border-radius:999px;background:var(--forest);color:white;text-decoration:none;font-weight:700}
@media(max-width:850px){.guest-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.guest-card{height:clamp(280px,55vw,400px)}}
@media(max-width:520px){main{padding:20px 14px 36px}.guest-grid{grid-template-columns:1fr;gap:16px}.guest-card{height:105vw;max-height:440px;min-height:300px}}
</style>
</head>
<body>
<header><a class="brand" href="index.html">Manral’s View</a></header>
<section class="intro"><p>A few moments, a lot of mountain memories.</p></section>
<main aria-label="Guest memories from Machhor">
  <div class="guest-grid">
    <article class="guest-card"><img src="shubham-dimri.jpg" alt="Shubham Dimri enjoying the mountain view" loading="lazy"><span class="guest-name">Shubham Dimri</span></article>
    <article class="guest-card"><img src="malvika-thakur.jpg" alt="Malvika Thakur during her visit" loading="lazy"><span class="guest-name">Malvika Thakur</span></article>
    <article class="guest-card"><img src="monica-malkotia.jpg" alt="Monica Malkotia during her visit" loading="lazy"><span class="guest-name">Monica Malkotia</span></article>
    <article class="guest-card"><img src="mukund-manral.jpg" alt="Mukund Manral at a waterfall" loading="lazy"><span class="guest-name">Mukund Manral</span></article>
    <article class="guest-card"><img src="ravi-sharma.jpg" alt="Ravi Sharma" loading="lazy"><span class="guest-name">Ravi Sharma</span></article>
    <article class="guest-card"><img src="tracy-mozhui.jpg" alt="Tracy Mozhui enjoying the misty hills" loading="lazy"><span class="guest-name">Tracy Mozhui</span></article>
  </div>
  <div class="back"><a href="index.html">← Back to Manral’s View</a></div>
</main>
</body>
</html>
